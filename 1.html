<!DOCTYPE html>

</head>
<body>
    <script>
        function max(a, b) {
            if (a > b) {
                return a;
            } else {
                return b;
            }
        }

        let num1 = 13;
        let num2 = 23;

        alert("Максимум из чисел " + num1 + " и " + num2 + " = " + max(num1, num2));
    </script>
</body>
